name: Powder Run production TestFlight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type UPLOAD POWDER RUN to confirm production upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: powder-run-production-testflight
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: com.goodusestudios.powderrun
  WIDGET_BUNDLE_ID: com.goodusestudios.powderrun.widgets
  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  SCHEME: Shell
  ARCHIVE_PATH: ${{ github.workspace }}/build/PowderRun.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm source matches passed iOS suite
        run: |
          git diff --quiet 4c02d5cda8519634eb6b24d95fd8b7a70a418d43 HEAD -- Shell ShellTests ShellUITests Packages PowderRunWidgets project.yml scripts || {
            echo 'App source changed since the passing iOS suite; run ios.yml before uploading.' >&2
            exit 1
          }
      - name: Confirm trigger
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$CONFIRMATION" == "UPLOAD POWDER RUN" ]] || { echo 'Confirmation must exactly match UPLOAD POWDER RUN.' >&2; exit 1; }
          [[ -n "$APPLE_TEAM_ID" ]] || { echo 'Set the APPLE_TEAM_ID repository variable.' >&2; exit 1; }
          build_number="$(date -u +%y%m%d%H%M).${GITHUB_RUN_NUMBER}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
      - name: Select Xcode and install XcodeGen
        run: |
          if [[ -d /Applications/Xcode_26.6.app ]]; then sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer; fi
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v rg >/dev/null || brew install ripgrep
          xcodebuild -version
      - name: Validate release source and generate Xcode project
        run: |
          scripts/validate-shell.sh --release
          xcodegen generate
      - name: Prepare App Store Connect credentials
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "$ASC_KEY_ID" ]] || missing+=(ASC_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(ASC_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(ASC_PRIVATE_KEY)
          (( ${#missing[@]} == 0 )) || { echo "Missing repository Actions secrets: ${missing[*]}" >&2; exit 1; }
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          umask 077
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Archive app with automatic signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          rm -rf "$ARCHIVE_PATH" "$EXPORT_PATH"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"
          xcodebuild -project Shell.xcodeproj -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$ARCHIVE_PATH" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" clean archive
      - name: Export and verify signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string automatic' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$export_options"
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist "$export_options" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          ditto -x -k "$IPA_PATH" "$verify"
          app="$(find "$verify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" == "$IOS_BUNDLE_ID" ]]
          widget="$(find "$app/PlugIns" -maxdepth 1 -type d -name '*.appex' -print -quit)"
          [[ -n "$widget" && "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget/Info.plist")" == "$WIDGET_BUNDLE_ID" ]] || { echo 'Powder Run widget extension is missing or has the wrong bundle ID.' >&2; exit 1; }
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist")" == "false" ]]
      - name: Validate and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: PowderRun-TestFlight-${{ env.BUILD_NUMBER }}
          path: ${{ env.IPA_PATH }}
          retention-days: 7
